device: auto
mic_snr_db: 30.0

equivalent_sources_2d:
  anchors: 80
  radii: [1.55, 1.70]
  phase_stagger: true
  use_ds_weighting: true

equivalent_sources_3d:
  anchors: 96
  radii: [1.10, 1.25]
  use_ds_weighting: true

models:
  pines_tanh:
    family: baseline_tanh_shared
    hidden_dim: 128
    hidden_layers: 4
    pe_levels: 0
    coord_scale: 2.0
    activation: tanh
    head_depth: 1
    skip_interval: 1
    gate_type: sigmoid
    w0: 30.0
    lr: 1.0e-3
    reg_coeff: 1.0e-6

  pines_siren:
    family: siren_shared
    hidden_dim: 128
    hidden_layers: 4
    pe_levels: 0
    coord_scale: 2.0
    activation: sine
    head_depth: 1
    skip_interval: 1
    gate_type: sigmoid
    w0: 30.0
    lr: 1.0e-3
    reg_coeff: 1.0e-6
